# Builds the site and publishes site/ to GitHub Pages (free hosting) via the gh-pages branch.
# The domain virtualleather.net (registered at Hostinger) points to GitHub Pages through DNS records;
# see README "Publishing". Pull requests only build and check.
# Etsy reviews are fetched before each build (when the ETSY_API_KEY secret is set) and refreshed
# every 6 hours by the schedule below.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Etsy reviews (official Etsy API; skipped without the ETSY_API_KEY secret)
        if: github.event_name != 'pull_request'
        run: npm run reviews
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      - run: npm run build
      - run: npm run check
      - name: Publish to GitHub Pages (gh-pages branch)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: virtualleather.net
          force_orphan: true
