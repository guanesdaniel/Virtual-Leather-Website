<div class="consent" id="consent" role="region" aria-label="Cookie consent" hidden>
  <div class="consent-box">
    <p class="consent-title">Cookies on Virtual Leather</p>
    <p>We use essential cookies to run the cart and checkout. With your permission we'd also like to use Google Analytics to understand how the site is used, and the Meta Pixel to measure our Facebook and Instagram ads. <a href="/cookies/">Cookie policy</a></p>
    <form class="consent-options" id="consent-options" hidden>
      <fieldset>
        <legend class="visually-hidden">Choose which cookies to allow</legend>
        <label class="check"><input type="checkbox" checked disabled> <span><strong>Essential</strong>: cart, checkout and remembering this choice. Always on.</span></label>
        <label class="check"><input type="checkbox" name="analytics"> <span><strong>Analytics</strong>: Google Analytics 4 visit statistics.</span></label>
        <label class="check"><input type="checkbox" name="marketing"> <span><strong>Marketing</strong>: Meta Pixel ad measurement (Facebook &amp; Instagram).</span></label>
      </fieldset>
    </form>
    <div class="consent-actions">
      <button type="button" class="btn btn-light" data-consent="reject">Reject optional</button>
      <button type="button" class="btn btn-light" data-consent="customise" aria-expanded="false" aria-controls="consent-options">Choose</button>
      <button type="button" class="btn btn-light" data-consent="save" hidden>Save choices</button>
      <button type="button" class="btn btn-light" data-consent="accept">Accept all</button>
    </div>
  </div>
</div>
