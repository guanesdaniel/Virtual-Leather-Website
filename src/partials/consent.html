<div class="consent" id="consent" role="region" aria-label="Cookie consent" hidden>
  <div class="consent-box">
    <p class="consent-text">We use cookies for stats and ads. <button type="button" class="link-button" data-consent="customise" aria-expanded="false" aria-controls="consent-options">More info</button></p>
    <form class="consent-options" id="consent-options" hidden>
      <p>Essential cookies run the cart and checkout. With your OK we also use Google Analytics (visit stats) and the Meta Pixel (ad measurement). <a href="/cookies/">Cookie policy</a></p>
      <fieldset>
        <legend class="visually-hidden">Choose which cookies to allow</legend>
        <label class="check"><input type="checkbox" name="analytics"> <span>Analytics</span></label>
        <label class="check"><input type="checkbox" name="marketing"> <span>Marketing</span></label>
      </fieldset>
    </form>
    <div class="consent-actions">
      <button type="button" class="btn btn-light" data-consent="reject">Reject</button>
      <button type="button" class="btn btn-light" data-consent="save" hidden>Save</button>
      <button type="button" class="btn btn-light" data-consent="accept">Accept</button>
    </div>
  </div>
</div>
